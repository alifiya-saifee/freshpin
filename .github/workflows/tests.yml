name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.14"]
        # Ubuntu 26.04 (ubuntu-latest) has no Python 3.9 build; test 3.9 on Linux with 24.04 instead.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
          # Windows refuses to delete open files and has a non-UTF-8 default encoding: both broke tests before.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No keys and no network services: FreshPin runs in replay mode, agent tests use a fake gateway.
      # The OpenAI Agents SDK agent test is skipped here (it needs the SDK installed in its own venv).
      - name: Unit tests (standard library only)
        env:
          FRESHPIN_MODE: replay
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      # The CI gate on a committed result: a bar the published agent meets passes, a bar it misses must fail.
      - name: Gate a committed result (pass and fail)
        run: |
          python -m freshpin gate bench/samples/agentbench-20261117-123528.json --agent tool_agent \
            --min-success 0.7 --min-success model_outage=0.9 --max-answered-anyway 0 --max-planted 1
          if python -m freshpin gate bench/samples/agentbench-20261117-123528.json --agent search_first \
            --min-success model_outage=0.5 > /dev/null; then echo "gate should have failed"; exit 1; fi
        shell: bash
